<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CDSS ABAWD | Participant Prototype</title><style>
:root{--navy:#073f78;--ink:#092c63;--blue:#0876ed;--green:#008d72;--purple:#7025a8;--orange:#f9780a;--teal:#008e94;--pink:#c60068}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fafcff}button,a{font:inherit}button{cursor:pointer}a{color:#005bbb}a:focus-visible,button:focus-visible{outline:3px solid #f28a00;outline-offset:3px}.top{background:white;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px max(3%,calc((100vw - 1440px)/2))}.brand{display:flex;align-items:center;gap:12px}.ca{font-size:40px;color:#e5a82c}.brand b{font-size:30px;letter-spacing:-1px}.brand small{font-size:15px;line-height:1.3;border-left:1px solid #ccd5df;padding-left:13px}.tools{text-align:right;font-size:13px}.tools a{margin-left:12px}.search{display:flex;margin-top:8px}.search input{padding:11px;border:1px solid #bbcddd;border-radius:5px 0 0 5px;min-width:235px}.search button{background:var(--navy);color:white;border:0;padding:10px 17px;border-radius:0 5px 5px 0}.nav{background:var(--navy);color:white;padding:16px max(3%,calc((100vw - 1440px)/2));display:flex;gap:42px;flex-wrap:wrap}.nav span{white-space:nowrap}.wrap{max-width:1450px;margin:auto;padding:24px 26px 55px}.crumb{font-size:14px;margin-bottom:22px;line-height:1.8}.crumb button,.back{background:none;border:0;color:#0061c5;padding:0;font-weight:600}.back{font-size:17px;margin:2px 0 24px}.hero{background:#e6f2ff;border-radius:14px;padding:26px 22px;display:flex;align-items:center;gap:23px;margin-bottom:16px}.hero .number{background:#0876ed;color:white;font-size:38px;font-weight:bold;width:78px;height:78px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}.hero .heroicon{font-size:64px}.hero h1{font-size:clamp(26px,3vw,42px);margin:0 0 7px}.hero p{font-size:21px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{border:1px solid #d8e6f2;border-radius:12px;padding:27px 25px;display:flex;gap:24px;align-items:flex-start;text-align:left;min-height:205px;color:var(--ink);position:relative;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-2px);box-shadow:0 7px 18px #12345a22}.tile .ico{font-size:49px;line-height:1.1;min-width:66px;text-align:center}.tile strong{display:block;font-size:23px;line-height:1.25;margin-bottom:10px}.tile .desc{font-size:17px;line-height:1.45;display:block}.tile .chev{position:absolute;right:19px;top:45%;font-size:32px;font-weight:bold}.blue{background:#e5f2ff;--accent:var(--blue)}.green{background:#e9f9f3;--accent:var(--green)}.purple{background:#f2ebfc;--accent:var(--purple)}.orange{background:#fff3e5;--accent:var(--orange)}.teal{background:#e5f9fb;--accent:var(--teal)}.pink{background:#fff0f6;--accent:var(--pink)}.ico,.chev{color:var(--accent)}.note{margin-top:23px;background:#e7f1fb;border-radius:12px;padding:21px 26px;font-size:17px;line-height:1.5}.note b{color:#004a9b}.intro{font-size:20px;max-width:840px;line-height:1.5}.smallgrid .tile{min-height:190px}.subpage{max-width:900px;margin:0 auto}.subpage h2{font-size:32px}.subpage p,.subpage li{font-size:18px;line-height:1.65}.subpage .box{border:1px solid #d7e4f1;background:white;border-radius:12px;padding:22px;margin:15px 0}.primary{background:#0059b5;color:white;border:0;border-radius:8px;padding:14px 20px;font-weight:bold}.footer{background:#edf3f9;border-top:1px solid #d6e0eb;padding:25px;text-align:center;color:#41546d;font-size:14px}.eyebrow{font-weight:700;color:#4d6078;font-size:13px;text-transform:uppercase;letter-spacing:.07em}.hidden{display:none!important}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.tile strong{font-size:20px}.top{flex-wrap:wrap}.nav{gap:15px}}@media(max-width:630px){.grid{grid-template-columns:1fr}.wrap{padding:18px 14px}.hero{align-items:flex-start;gap:12px}.hero .number{width:48px;height:48px;font-size:25px}.hero .heroicon{font-size:35px}.hero p{font-size:16px}.tile{min-height:155px}.tools{text-align:left}.brand b{font-size:24px}.brand small{font-size:12px}.nav{font-size:13px}}
</style></head><body><header><div class="top"><div class="brand"><span class="ca" aria-hidden="true">◢</span><b>CDSS</b><small>California Department<br>of Social Services</small></div><div class="tools"><div><a href="#help" onclick="go('help')">Contact Us</a> | <a href="#help" onclick="go('help')">Translate</a> | <a href="#help" onclick="go('help')">Search</a></div><form class="search" onsubmit="event.preventDefault();go('help')"><input aria-label="Search CDSS (prototype)" placeholder="Search CDSS..."><button aria-label="Search">⌕</button></form></div></div><nav class="nav" aria-label="Illustrative site navigation"><span>Home ⌄</span><span>Services &amp; Programs ⌄</span><span>Providers ⌄</span><span>Data &amp; Reports ⌄</span><span>About CDSS ⌄</span></nav></header><main class="wrap"><div id="crumb" class="crumb"></div><div id="view"></div></main><footer class="footer">Conceptual design for CDSS review • Not an official CDSS website or eligibility determination • Content and links require agency validation</footer><script>
const topics=[{id:'check',n:1,title:'Check if ABAWD applies to you',desc:'Use the existing CDSS pre-screening resource to learn whether the rules may apply.',icon:'▣',color:'blue'},{id:'who',n:2,title:'Who may be subject to ABAWD?',desc:'Learn about age, CalFresh status, and other factors.',icon:'♟',color:'green'},{id:'included',n:3,title:'Learn more about who is included',desc:'See more information about people who may be subject to the rules.',icon:'▤',color:'purple'},{id:'unsure',n:4,title:'If you are not sure',desc:'Find explanations and guidance about your situation.',icon:'?',color:'orange'},{id:'county',n:5,title:'Contact your county',desc:'Ask your county about your specific CalFresh case.',icon:'☎',color:'teal'},{id:'faq',n:6,title:'View FAQs',desc:'Read answers to common questions about ABAWD.',icon:'▧',color:'pink'}];
const participant=[{id:'apply',n:1,title:'Do the work requirements apply to me?',icon:'▤',color:'blue'},{id:'ways',n:2,title:'Ways to meet the requirements',icon:'☑',color:'green'},{id:'exempt',n:3,title:'Exemptions',icon:'⬡',color:'purple'},{id:'time',n:4,title:'Time limits',icon:'◷',color:'orange'},{id:'next',n:5,title:'What should I do next?',icon:'▦',color:'teal'},{id:'help',n:6,title:'Need more help?',icon:'☎',color:'pink'}];
const info={who:['Who may be subject to ABAWD?','ABAWD rules can apply to some adults receiving CalFresh. Age and other circumstances matter. The county determines whether the requirements apply to you.'],included:['Learn more about who is included','Review the current CDSS guidance for the complete list of people who may be subject to ABAWD requirements and possible exemptions.'],unsure:['If you are not sure','You can review the existing pre-screening information and contact your county to discuss your circumstances.'],county:['Contact your county','Your county CalFresh office can answer case-specific questions, explain reporting requirements, and discuss possible exemptions.'],faq:['Frequently asked questions','What is ABAWD? Do the rules apply to me? What activities count? Can I qualify for an exemption? Contact your county or consult approved CDSS guidance for answers.'],ways:['Ways to meet the requirements','Work, certain training or education activities, and other approved activities may count. Check the current CDSS guidance and confirm your circumstances with your county.'],exempt:['Exemptions','Some participants may qualify for an exemption from ABAWD requirements. The county reviews individual circumstances.'],time:['Time limits','Some adults may face a three-month CalFresh time limit within a three-year period unless they meet a requirement or qualify for an exemption. County waivers and policy effective dates can affect the rules.'],next:['What should I do next?','Review whether ABAWD may apply to you, learn about ways to meet the requirements and exemptions, and contact your county if you need assistance.'],help:['Need more help?','Find county contact information and approved CDSS resources. Language and accessibility assistance should be available through official channels.']};
const el=document.getElementById('view'),cr=document.getElementById('crumb');function card(x){return `<button class="tile ${x.color}" onclick="go('${x.id}')"><span class="ico" aria-hidden="true">${x.icon}</span><span><strong>${x.title}</strong>${x.desc?`<span class="desc">${x.desc}</span>`:''}</span><span class="chev" aria-hidden="true">›</span></button>`}function hero(n,icon,title,desc){return `<div class="hero"><span class="number">${n}</span><span class="heroicon" aria-hidden="true">${icon}</span><div><h1>${title}</h1><p>${desc}</p></div></div>`}function go(id){location.hash=id;render()}function render(){const id=decodeURIComponent(location.hash.slice(1))||'main';const trail=`<a href="#main">Home</a> › <a href="#main">CalFresh</a> › <a href="#main">Work and Community Engagement Requirements (ABAWD)</a> › <a href="#participant">I'm a CalFresh Participant</a>`;cr.innerHTML=trail+(id==='apply'?' › <b>Do the work requirements apply to me?</b>':id==='participant'||id==='main'?'':` › <b>${info[id]?.[0]||'Topic'}</b>`);
if(id==='main'){el.innerHTML=`<h1>CalFresh Work and Community Engagement Requirements (ABAWD)</h1><p class="intro">Choose the information that is right for you.</p><div class="grid smallgrid">${[{id:'participant',title:"I'm a CalFresh Participant",icon:'👤',color:'blue',desc:'Find out if the rules may apply to you.'},{id:'county',title:"I'm a County Worker",icon:'🏛️',color:'green',desc:'Find staff resources.'},{id:'help',title:"I'm a Community Partner",icon:'👥',color:'purple',desc:'Find outreach resources.'}].map(card).join('')}</div>`;return}
if(id==='participant'){el.innerHTML=`<button class="back" onclick="go('main')">‹ Back to ABAWD main page</button><h1>I'm a CalFresh Participant</h1><p class="intro">Find information about work requirements, your options, and where to get help.</p><div class="grid smallgrid">${participant.map(card).join('')}</div>`;return}
if(id==='apply'){el.innerHTML=`<button class="back" onclick="go('participant')">‹ Back to all participant tiles</button>${hero(1,'▤','Do the work requirements apply to me?','Find out if you may be subject to ABAWD work requirements.')}<div class="grid">${topics.map(card).join('')}</div><div class="note"><b>Note:</b> This prototype provides general information only. Your county determines whether work requirements apply to your case. The pre-screening tool should link to the existing CDSS resource after approval.</div>`;return}
if(id==='check'){el.innerHTML=`<button class="back" onclick="go('apply')">‹ Back to tile 1</button>${hero(1,'▣','Check if ABAWD applies to you','Use the existing CDSS pre-screening resource.')}<div class="subpage"><div class="box"><h2>Pre-screening information</h2><p>This prototype does not calculate eligibility or make an official determination. The final site should link directly to the existing CDSS pre-screening tool.</p><button class="primary" onclick="go('county')">Where can I get help?</button></div></div>`;return}
const x=info[id];if(x){const p=participant.find(z=>z.id===id);el.innerHTML=`<button class="back" onclick="go('${topics.some(t=>t.id===id)?'apply':'participant'}')">‹ Back to ${topics.some(t=>t.id===id)?'tile 1':'all participant tiles'}</button>${hero(p?.n||'•',p?.icon||'▤',x[0],'Information and resources')}<div class="subpage"><div class="box"><h2>${x[0]}</h2><p>${x[1]}</p><p><strong>For CDSS review:</strong> Add approved source links, verified policy text, and accessibility-tested content before publishing.</p><button class="primary" onclick="go('participant')">View all participant tiles</button></div></div>`;return}go('apply')};window.addEventListener('hashchange',render);render();
</script></body></html>
